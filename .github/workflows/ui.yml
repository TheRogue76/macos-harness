name: UI flows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Hide the Dock, which covers the bottom of the runner's small screen
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType | grep -E "Resolution|UI Looks like" || true
          defaults write com.apple.dock autohide -bool true
          killall Dock
      - name: Build and install the dev app with an ad-hoc signature
        run: HARNESS_SIGN_IDENTITY=- scripts/build-app.sh dev --install
      - name: Doctor
        run: ~/.local/bin/macos-harness-dev doctor
      - name: Check every flow
        run: ~/.local/bin/macos-harness-dev flow check flows
      - name: Run the fixture and app flows
        run: ~/.local/bin/macos-harness-dev flow run flows/fixture flows/apps --record failures --junit flow-results/junit.xml --artifacts flow-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-results-${{ matrix.os }}
          path: flow-results
          if-no-files-found: ignore

  ios:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Hide the Dock, which covers the bottom of the runner's small screen
        run: |
          system_profiler SPDisplaysDataType | grep -E "Resolution|UI Looks like" || true
          defaults write com.apple.dock autohide -bool true
          killall Dock
      - name: Turn off crash report dialogs, which cover the screen when a simulator app crashes
        run: defaults write com.apple.CrashReporter DialogType -string none
      - name: Create a simulator and start booting it, so it settles while the rest builds
        run: |
          xcodebuild -version
          udid=$(xcrun simctl create "macos-harness CI" "iPhone 18 Pro")
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Build and install the dev app with an ad-hoc signature
        run: HARNESS_SIGN_IDENTITY=- scripts/build-app.sh dev --install
      - name: Doctor
        run: ~/.local/bin/macos-harness-dev doctor
      - name: Build the iOS fixture, so the flow's build has nothing left to do
        run: ~/.local/bin/macos-harness-dev build --project fixtures/ios/HarnessFixtureiOS.xcodeproj --scheme HarnessFixtureiOS --device "$SIMULATOR"
      - name: Wait for the simulator and show it in Device Hub
        run: |
          xcrun simctl bootstatus "$SIMULATOR"
          ~/.local/bin/macos-harness-dev sim boot "$SIMULATOR"
      - name: Wait for the runner to settle after booting and building
        run: |
          cpus=$(sysctl -n hw.ncpu)
          for i in $(seq 1 30); do
            load=$(sysctl -n vm.loadavg | awk '{print $2}')
            echo "load $load on $cpus CPUs"
            awk -v l="$load" -v c="$cpus" 'BEGIN { exit !(l < c * 2) }' && break
            sleep 10
          done
      - name: Run the iOS flows
        run: ~/.local/bin/macos-harness-dev flow run flows/ios --var "device=$SIMULATOR" --record failures --junit flow-results/ios-junit.xml --artifacts flow-results
      - name: Save the screen and Device Hub's state
        if: failure()
        run: |
          mkdir -p flow-results
          screencapture -x flow-results/screen.png || true
          ~/.local/bin/macos-harness-dev apps --all > flow-results/apps.txt 2>&1 || true
          ~/.local/bin/macos-harness-dev windows --app "Device Hub" > flow-results/device-hub-windows.txt 2>&1 || true
          ~/.local/bin/macos-harness-dev spike axtree "Device Hub" 400 > flow-results/device-hub-tree.txt 2>&1 || true
          xcrun simctl list devices > flow-results/simulators.txt 2>&1 || true
          top -l 2 -o cpu -n 25 -stats pid,command,cpu,mem > flow-results/cpu.txt 2>&1 || true
          log show --last 20m --style compact --info --predicate 'process == "macos-harness-helper"' > flow-results/helper-log.txt 2>&1 || true
      - name: Save the helper's journal
        if: always()
        run: |
          mkdir -p flow-results
          cp -R "$HOME/Library/Logs/macos-harness/journal-dev" flow-results/journal 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-flow-results
          path: flow-results
          if-no-files-found: ignore
