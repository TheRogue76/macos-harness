name: UI flows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flows:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build and install the dev app with an ad-hoc signature
        run: HARNESS_SIGN_IDENTITY=- scripts/build-app.sh dev --install
      - name: Doctor
        run: ~/.local/bin/macos-harness-dev doctor
      - name: Check every flow
        run: ~/.local/bin/macos-harness-dev flow check flows
      - name: Run the fixture and app flows
        run: ~/.local/bin/macos-harness-dev flow run flows/fixture flows/apps --junit flow-results/junit.xml --artifacts flow-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-results
          path: flow-results
          if-no-files-found: ignore
