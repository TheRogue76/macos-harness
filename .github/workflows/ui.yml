name: UI flows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 26 or later, which the package's tools version needs
        run: |
          if [ "$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')" -lt 26 ]; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -iv beta | sort -V | tail -1)"
          fi
      - name: Hide the Dock, which covers the bottom of the runner's small screen
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType | grep -E "Resolution|UI Looks like" || true
          defaults write com.apple.dock autohide -bool true
          killall Dock
      - name: Build and install the dev app with an ad-hoc signature
        run: HARNESS_SIGN_IDENTITY=- scripts/build-app.sh dev --install
      - name: Doctor
        run: ~/.local/bin/macos-harness-dev doctor
      - name: Check every flow
        run: ~/.local/bin/macos-harness-dev flow check flows
      - name: Run the fixture, app and Mac build flows
        run: |
          xcodebuild -version
          ~/.local/bin/macos-harness-dev flow run flows/fixture flows/apps flows/mac --record failures --junit flow-results/junit.xml --artifacts flow-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flow-results-${{ matrix.os }}
          path: flow-results
          if-no-files-found: ignore

  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        compositor: [mutter, sway, kwin_wayland]
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
      SWIFTLY_HOME_DIR: /opt/swiftly
      SWIFTLY_BIN_DIR: /opt/swiftly/bin
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install GTK 4, the compositor, the accessibility bus and what Swift's installer needs
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg git python3 python3-gi libgtk-4-dev libadwaita-1-dev at-spi2-core dbus tesseract-ocr > /dev/null
          case "${{ matrix.compositor }}" in
            kwin_wayland)
              apt-get install -y -qq kwin-wayland kwin-common xdg-desktop-portal xdg-desktop-portal-kde \
                qml6-module-qt5compat-graphicaleffects pipewire wireplumber libcap2-bin > /dev/null
              setcap -r /usr/bin/kwin_wayland
              ;;
            *) apt-get install -y -qq ${{ matrix.compositor }} > /dev/null ;;
          esac
      - uses: actions/checkout@v7
      - name: Install Swift with swiftly
        run: |
          cd /tmp
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$SWIFTLY_HOME_DIR/env.sh"
          swiftly install 6.4.1 --use --assume-yes --post-install-file /tmp/swift-dependencies.sh
          if [ -s /tmp/swift-dependencies.sh ]; then sh /tmp/swift-dependencies.sh > /dev/null; fi
          echo "$(swiftly use --print-location)/usr/bin" >> "$GITHUB_PATH"
      - name: Build
        run: swift build
      - name: Run the fixture flows in a headless desktop
        run: |
          mkdir -p flow-results
          flows=flows/fixture
          if [ "${{ matrix.compositor }}" = mutter ]; then flows=$(ls flows/fixture/*.yaml | grep -vE '/(pointer|ocr).yaml'); fi
          if [ "${{ matrix.compositor }}" = kwin_wayland ]; then flows=$(ls flows/fixture/*.yaml | grep -v /ocr.yaml); fi
          HEADLESS_DESKTOP_COMPOSITOR=${{ matrix.compositor }} HEADLESS_DESKTOP_LOG=flow-results/compositor.log scripts/headless-desktop.sh \
            .build/debug/macos-harness flow run $flows --junit flow-results/linux-desktop-junit.xml --artifacts flow-results
      - name: Gather the helper's log
        if: always()
        run: cp ~/.local/state/macos-harness/helper-*.log flow-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-desktop-${{ matrix.compositor }}-flow-results
          path: flow-results
          if-no-files-found: ignore

  android-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      MACOS_HARNESS_LAUNCH: child
      MACOS_HARNESS_AUTO_APPROVE: "1"
      SWIFTLY_HOME_DIR: /opt/swiftly
      SWIFTLY_BIN_DIR: /opt/swiftly/bin
    steps:
      - uses: actions/checkout@v7
      - name: Let the runner's user use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Swift with swiftly
        run: |
          cd /tmp
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$SWIFTLY_HOME_DIR/env.sh"
          swiftly install 6.4.1 --use --assume-yes --post-install-file /tmp/swift-dependencies.sh
          if [ -s /tmp/swift-dependencies.sh ]; then sudo apt-get update -qq && sudo sh /tmp/swift-dependencies.sh; fi
          echo "$(swiftly use --print-location)/usr/bin" >> "$GITHUB_PATH"
      - name: Free disk space, since the emulator wants 12 GB for its data partition
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$ANDROID_HOME/ndk" /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the emulator and an Android 35 system image
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" --install "cmdline-tools;latest" platform-tools emulator "build-tools;35.0.0" "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64" > /dev/null
          tools="$(ls -d "$ANDROID_HOME"/cmdline-tools/latest* | sort -V | tail -1)/bin"
          echo "using $tools"
          echo no | "$tools/avdmanager" create avd -n macos_harness_tests -k "system-images;android-35;google_apis;x86_64" -d pixel_8
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx macos_harness_tests
      - name: Build
        run: swift build
      - name: Boot the emulator without a window
        timeout-minutes: 12
        run: |
          "$ANDROID_HOME/emulator/emulator" -accel-check
          nohup "$ANDROID_HOME/emulator/emulator" -avd macos_harness_tests -no-window -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim -camera-back none > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          booted=
          for _ in $(seq 1 120); do
            if ! kill -0 "$emulator" 2>/dev/null; then
              echo "the emulator exited:"; tail -30 emulator.log; exit 1
            fi
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { booted=1; break; }
            sleep 5
          done
          [ -n "$booted" ] || { echo "Android didn't finish booting in 10 minutes:"; tail -30 emulator.log; exit 1; }
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0
          .build/debug/macos-harness android list
      - name: Run the Android flow
        run: |
          .build/debug/macos-harness flow run flows/android --var device=macos_harness_tests \
            --junit flow-results/android-junit.xml --artifacts flow-results
      - name: Gather the emulator's and the helper's logs
        if: always()
        run: |
          mkdir -p flow-results
          cp emulator.log flow-results/ 2>/dev/null || true
          cp ~/.local/state/macos-harness/helper-*.log flow-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-linux-flow-results
          path: flow-results
          if-no-files-found: ignore

