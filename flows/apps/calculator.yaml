name: Calculator multiplies
app: Calculator
setup:
  - launch: Calculator
  - press: { id: Clear }
    only_if: { id: Clear }
  - press: { id: AllClear }
    only_if: { id: AllClear }
steps:
  - press: { id: One }
  - press: { id: Two }
  - press: { id: Multiply }
  - press: { id: Three }
  - press: { id: Four }
  - press: { id: Equals }
  - expect: { role: text, text: "408" }
teardown:
  - quit: Calculator
