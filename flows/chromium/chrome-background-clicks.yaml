name: Chrome takes background clicks that rebuild the page
app: test-chrome
vars:
  profile: /tmp/macos-harness-chrome-rebuild
setup:
  - shell: "case '${profile}' in /tmp/macos-harness-*) rm -rf '${profile}' && mkdir -p '${profile}';; *) exit 1;; esac"
  - launch:
      app: Google Chrome
      new_instance: true
      as: test-chrome
      arguments:
        - "--user-data-dir=${profile}"
        - --no-first-run
        - --no-default-browser-check
        - --force-renderer-accessibility
        - "file://${flow_dir}/pages/rebuild.html"
  - wait: { role: heading, text: "Page 0", timeout: 20 }
steps:
  - click: { role: link, text: "Go 1", exact: true }
  - expect: { role: heading, text: "Page 1", exact: true }
  - click: { role: link, text: "Go 2", exact: true }
  - expect: { role: heading, text: "Page 2", exact: true }
  - click: { role: link, text: "Go 3", exact: true }
  - expect: { role: heading, text: "Page 3", exact: true }
  - click: { role: link, text: "Go 0", exact: true }
  - expect: { role: heading, text: "Page 0", exact: true }
  - click: { role: link, text: "Go 1", exact: true }
  - expect: { role: heading, text: "Page 1", exact: true }
  - click: { role: link, text: "Go 2", exact: true }
  - expect: { role: heading, text: "Page 2", exact: true }
  - click: { role: link, text: "Go 3", exact: true }
  - expect: { role: heading, text: "Page 3", exact: true }
  - click: { role: link, text: "Go 0", exact: true }
  - expect: { role: heading, text: "Page 0", exact: true }
  - click: { role: link, text: "Go 1", exact: true }
  - expect: { role: heading, text: "Page 1", exact: true }
  - click: { role: link, text: "Go 2", exact: true }
  - expect: { role: heading, text: "Page 2", exact: true }
  - click: { role: link, text: "Go 3", exact: true }
  - expect: { role: heading, text: "Page 3", exact: true }
  - click: { role: link, text: "Go 0", exact: true }
  - expect: { role: heading, text: "Page 0", exact: true }
  - expect: { role: window, text: Crashed, gone: true }
teardown:
  - quit: { app: test-chrome, if_launched: true }
  - shell: "case '${profile}' in /tmp/macos-harness-*) rm -rf '${profile}';; esac"
